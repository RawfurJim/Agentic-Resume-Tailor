<script nonce="x">AF_initDataCallback({key: 'ds:1', hash: '2', data:[[["72888471085032134","Firmware Engineer, Modem/Telephony Protocol and AI Automation","https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckXpwFFsg5ZKe_nSGJN_F33o3Ba634k96p8JDbuVocuXEEjsA1Ny_i-orFOWpfGdxHI2_rOQPwOgxpudUw9dUGc4dRT5WVhoQas7b7ojpu9N64tTTHqpnYYi5Xk498w%3D%3D_V2&loc=GB&title=Firmware+Engineer",[null,"<ul>\n<li>Develop, customize and plan tests of Android/Modem software to meet customer and project requirements in IMS/Telephony domain/NAS. Think of end user mobile use cases to uncover issues during the test campaign by adding scenarios to test coverage for increasing confidence on Pixel product.</li>\n<li>Analyze Android/Modem IMS, NAS and access stratum (AS) protocol functional and performance issues.</li>\n<li>Collaborate with cross-layer teams (Telephony/IMS/NAS/AS) and cross-organization teams (Android Software, TPM/TAM and Hardware) for intime prioritization and resolution of issue ensuing high quality Pixel Android/Modem software.</li>\n<li>Use AI and automation as a primary vehicle to execute work and enhance productivity, innovate solutions for issue triage and other mundane task.</li>\n<li>Generate ideas, develop features, build SW/HW systems and/or improve engineering processes and automation to help product velocity and quality.</li>\n</ul>"],[null,"<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor's degree in Communication Engineering, Electrical Engineering, a related field, or equivalent practical experience.</li>\n<li>5 years of experience with IMS protocols and 3GPP NAS.</li>\n<li>5 years of experience with LTE or 5G NR.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Experiences in Android/Modem software development/testing/engineering, problem resolving and troubleshooting.</li>\n<li>Experience with programming, scripting or engineering automation using AI.</li>\n<li>Experience and understanding of 3GPP LTE/NR Layer 3 NAS protocol standards.</li>\n<li>Familiarity with IMS protocol standards, VoLTE, VoNR, VoWifi.</li>\n<li>Strong communication and collaboration skills.</li>\n</ul>"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["London, UK",["1 St Giles High St, London WC2H 8JR, UK"],"London","WC2H 8JR","England","GB"]],[null,"<p>Google's software engineers develop the next-generation technologies that change how billions of users connect, explore, and interact with information and one another. Our products need to handle information at massive scale, and extend well beyond web search. We're looking for engineers who bring fresh ideas from all areas, including information retrieval, distributed computing, large-scale system design, networking and data storage, security, artificial intelligence, natural language processing, UI design and mobile; the list goes on and is growing every day. As a software engineer, you will work on a specific project critical to Google’s needs with opportunities to switch teams and projects as you and our fast-paced business grow and evolve. We need our engineers to be versatile, display leadership qualities and be enthusiastic to take on new problems across the full-stack as we continue to push technology forward.<br><br>With your technical expertise you will manage project priorities, deadlines, and deliverables. You will design, develop, test, deploy, maintain, and enhance software solutions.</p>\n<p>As a protocol multimedia subsystem (IMS)/Telephony/NAS Firmware Engineer in Pixel Testing Engineering, you will focus on carrier feature development/customization/testing and performance enhancement of IMS/Telephony/non-access stratum (NAS) features, working with Pixel Software teams and chipset vendors. You will be point-of-contact for Pixel, launch testing for carriers in the region, overseeing cellular feature/regression/certification functional and performance test execution, debugging, analyzing and working with IMS/NAS/AS teams for the resolution.<br><br>You will also develop AI driven automation not only for automating your own tasks but also in innovating and contributing to streamlining processes used by the team.</p><p>The Google Pixel team focuses on designing and delivering the world's most helpful mobile experience. The team works on shaping the future of Pixel devices and services through some of the most advanced designs, techniques, products, and experiences in consumer electronics. This includes bringing together the best of Google’s artificial intelligence, software, and hardware to build global smartphones and create transformative experiences for users across the world.</p>"],[2],[1788964623,806000000],[1788964623,806000000],[1788964623,890000000],[null,""],null,null,[null,""],[null,"<ul>\n<li>Bachelor's degree in Communication Engineering, Electrical Engineering, a related field, or equivalent practical experience.</li>\n<li>5 years of experience with IMS protocols and 3GPP NAS.</li>\n<li>5 years of experience with LTE or 5G NR.</li>\n</ul>"],2],["131855627575009990","Research Engineer, World Models, DeepMind","https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckVYSduipLfh2qcxJ0-WcfV5NUDMQucBeVv16DaZeSuewEjsA1Ny_i6vx-rOVI_xuiMkE8Kp4hsb1dOAMjS5NHFN0bIh0Q55v0ibs6UXwVD8q7BUM4eLflfRujAkWiQ%3D%3D_V2&loc=GB&title=Research+Engineer",[null,"<ul>\n<li>Architect and implement next-generation model architectures in collaboration with research teams to advance frontier world models.</li>\n<li>Design and iterate on real-world evaluation pipelines to systematically measure and accelerate model capabilities.</li>\n<li>Engineer high-performance model distillation and optimization techniques to support real-time serving at global scale.</li>\n<li>Build scalable data ingestion pipelines and automated filtering mechanisms, using rigorous dataset analysis to maximize training quality and drive downstream benchmark gains.</li>\n</ul>"],[null,"<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor’s degree or equivalent practical experience.</li>\n<li>5 years of experience developing, training, and deploying diffusion models and generative video architectures.</li>\n<li>Experience writing custom GPU/TPU kernels (e.g., JAX or PyTorch) for model serving.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>PhD in Computer Science, Machine Learning, AI, or a related quantitative field or equivalent practical experience.</li>\n<li>Experience in frontier AI research labs within pre-training or post-training teams.</li>\n<li>Proficiency in writing TPU/GPU custom kernels to optimize model performance and inference.</li>\n<li>Proven track record of deploying machine learning models to production at scale or publishing widely adopted open-source research.</li>\n</ul>"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/5364d68d-d016-48b0-a6ec-0c6fe5032c6c",null,"DeepMind","en-US",[["London, UK",["1 St Giles High St, London WC2H 8JR, UK"],"London","WC2H 8JR","England","GB"]],[null,"<p>At Google, research-focused Software Engineers are embedded throughout the company, allowing them to setup large-scale tests and deploy promising ideas quickly and broadly. Ideas may come from internal projects as well as from collaborations with research programs at partner universities and technical institutes all over the world.</p><p>From creating experiments and prototyping implementations to designing new architectures, engineers work on real-world problems including artificial intelligence, data mining, natural language processing, hardware and software performance analysis, improving compilers for mobile platforms, as well as core search and much more. But you stay connected to your research roots as an active contributor to the wider research community by partnering with universities and publishing papers.</p>\n<p>We are seeking a Research Engineer with a proven track record of building and shipping generative models in the real world. In this role, you will have strong engineering background in building, testing and deploying diffusion models applied to real-time video generation. You will work with our modeling, data and eval teams to integrate and scale up model capabilities. You will also have the opportunity to interface with the product team to refine the scope of our deployments. </p><p>You will drive cross-functional collaboration to establish rapid, iterative feedback loops spanning playtesting, real-time user insights, and rigorous evaluation frameworks. This high impact role requires deep direct technical leadership – architecting and maintaining robust, scalable codebases while pioneering advanced AI-driven code generation and automated code review workflows.</p><p>Artificial intelligence will be one of humanity’s most transformative inventions. At Google DeepMind, we are a pioneering AI lab with exceptional interdisciplinary teams focused on advancing AI development to solve complex global challenges and accelerate high-quality product innovation for billions of users. We use our technologies for widespread public benefit and scientific discovery, ensuring safety and ethics are always our highest priority.</p><div><br>We are pushing the boundaries across multiple domains. Our global teams offer diverse learning opportunities and varied career pathways for those driven to achieve exceptional results through collective effort.</div>"],[2,4],[1788527311,578000000],[1788527311,578000000],[1788527311,648000000],[null,""],null,null,[null,""],[null,"<ul>\n<li>Bachelor’s degree or equivalent practical experience.</li>\n<li>5 years of experience developing, training, and deploying diffusion models and generative video architectures.</li>\n<li>Experience writing custom GPU/TPU kernels (e.g., JAX or PyTorch) for model serving.</li>\n</ul>"]],["133517804614623942","Applied AI Engineer","https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckV6Zg4BFMwN8qdJ7qLPH4fx8uTHIO3NrL6jdVP8MysyfEjsA9yzvgun2zS9UHABMd8BgpiLCG7ldDN-sgCn_j-4CHmWdoDC8cPGUEeVkT8WWMW-HYlJr4VTYA6b-xQ%3D%3D_V2&loc=GB&title=Applied+AI+Engineer",[null,"<ul>\n<li>Build high-performance evaluation (Eval) pipelines and observability frameworks to ensure agentic systems meet requirements for accuracy, safety, and latency.</li>\n<li>Own the delivery of the Customer User Journeys (CUJs), ensuring that conversational flows are not just functional, but optimized and production ready for (top customer/industry priorities).</li>\n<li>Architect and optimize complex agentic workloads, focusing on reasoning loops, tool selection, and reducing latency while maintaining production-grade security and networking.</li>\n<li>Implement critical infrastructure including rate limiting, error managing, and regional failover strategies; develop monitor systems and alerting dashboards during \"Go-Live\" windows to ensure stability as traffic scales.</li>\n<li>Travel up to 50% of the time.</li>\n</ul>"],[null,"<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor’s degree in Engineering, Computer Science, a related field, or equivalent practical experience.</li>\n<li>6 years of experience with software development using Python or similar coding languages.</li>\n<li>Experience taking production-grade AI-driven solutions from conception to launch and architecting AI systems on cloud platforms (e.g., GCP).</li>\n<li>Experience developing AI/GenAI solutions utilizing AI tools, or designing multi-agent workflows or RAG systems.</li>\n<li>Experience developing and deploying multilingual natural language processing models.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Experience in debugging Agent logic (ReAct loops, Chain of Thought) and optimizing tool selection.</li>\n<li>Experience with troubleshooting live, high-traffic systems during critical windows.</li>\n<li>Experience connecting agents to enterprise knowledge bases and optimizing RAG chunking to prevent hallucinations.</li>\n<li>Ability to trace conversation IDs across microservices to identify and resolve failures in real-time.</li>\n<li>Ability to travel up to 50% as require.</li>\n</ul>"],"projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc",null,"Google","en-US",[["London, UK",["1 St Giles High St, London WC2H 8JR, UK"],"London","WC2H 8JR","England","GB"],["Madrid, Spain",["Madrid, Spain"],"Madrid",null,"MD","ES"]],[null,"Google Cloud accelerates every organization’s ability to digitally transform its business and industry. We deliver enterprise-grade solutions that leverage Google’s cutting-edge technology, and tools that help developers build more sustainably. Customers in more than 200 countries and territories turn to Google Cloud as their trusted partner to enable growth and solve their most critical business problems.Google Cloud accelerates every organization’s ability to digitally transform its business and industry. We deliver enterprise-grade solutions that leverage Google’s cutting-edge technology, and tools that help developers build more sustainably. Customers in more than 200 countries and territories turn to Google Cloud as their trusted partner to enable growth and solve their most critical business problems.Individual pay is determined by factors including job-related skills, experience, and relevant education or training.  <br><br>Spain: €90000 - €92000 (EUR) + 15% bonus target + equity + benefits<br><br>Learn more about <a href=\"https://www.google.com/about/careers/applications/benefits/\" target=\"_blank\">benefits at Google</a>."],[2],[1789737191,496000000],[1789737191,496000000],[1789737191,562000000],[null,""],null,null,[null,"Note: By applying to this position you will have an opportunity to share your preferred working location from the following: <b>London, UK; Madrid, Spain</b>."],[null,"<ul>\n<li>Bachelor’s degree in Engineering, Computer Science, a related field, or equivalent practical experience.</li>\n<li>6 years of experience with software development using Python or similar coding languages.</li>\n<li>Experience taking production-grade AI-driven solutions from conception to launch and architecting AI systems on cloud platforms (e.g., GCP).</li>\n<li>Experience developing AI/GenAI solutions utilizing AI tools, or designing multi-agent workflows or RAG systems.</li>\n<li>Experience developing and deploying multilingual natural language processing models.</li>\n</ul>"],2]],null,3,20], sideChannel: {}});</script>
