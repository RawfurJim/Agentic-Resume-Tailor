# ── Job Boards ────────────────────────────────────────────────────────
# Multi-employer aggregators. Unlike tracked_companies (one entry = one employer),
# job boards return offers from many companies in a single API call.
# Same title/location filtering and dedup apply.

job_boards:

  # -- Remote AI feeds (UK/EMEA rows kept by location_filter) --
  - name: Agentic Engineering Jobs
    provider: agentic-jobs
    notes: "AI-agent engineering roles; public API, 50/page."
    enabled: true

  - name: Himalayas
    provider: himalayas
    notes: "Remote-jobs aggregator; location_filter keeps UK/EMEA."
    enabled: true

  - name: Remotive
    provider: remotive
    aggregator: true
    notes: "Round 5 (2026-09-22): remote-jobs aggregator; rows are located 'Europe' / 'UK' so location_filter keeps the UK-eligible ones."
    enabled: true

  - name: Jobicy (UK remote)
    provider: jobicy
    aggregator: true
    jobicy:
      geo: uk
      count: 100
    notes: "Round 5 (2026-09-22): Jobicy's feed filtered to the UK region (the provider fetched 50 worldwide rows before)."
    enabled: true

  # ── UK job-market platforms (round 5, 2026-09-22) — need free API keys in .env ──
  # Adzuna aggregates Reed, TotalJobs, CV-Library, LinkedIn and most UK boards;
  # Reed is the UK's largest job site. Both have official JSON APIs with free
  # keys. Without the key the entry reports one clear error and the run goes on.
  - name: Adzuna (UK)
    provider: adzuna
    aggregator: true
    adzuna:
      country: gb
      queries: ["AI Engineer", "Machine Learning Engineer", "Data Scientist", "LLM Engineer", "Forward Deployed Engineer", "GenAI"]
      max_days_old: 60
      max_pages: 2          # 50 results/page per query
    notes: "Keys: ADZUNA_APP_ID + ADZUNA_APP_KEY from https://developer.adzuna.com (free)."
    enabled: true

  - name: Reed.co.uk
    provider: reed
    aggregator: true
    reed:
      queries: ["AI Engineer", "Machine Learning Engineer", "Data Scientist", "LLM Engineer", "Forward Deployed Engineer", "GenAI"]
      max_pages: 2          # 100 results/page per query
    notes: "Key: REED_API_KEY from https://www.reed.co.uk/developers/jobseeker (free). Permanent, full-time rows only."
    enabled: true

  # ── Telegram channels (public) ─────────────────────────────────────
  # Public web preview at https://t.me/s/<channel>: no API key, no login.
  # 20 posts per page, walked back until since_days (default 30) or max_pages
  # (cap 10; a cut-short window is warned about). A private channel is
  # reported, not skipped.
  #
  # A post is emitted only when it names an employer AND links to a vacancy
  # (Source Indexing Policy, rules 1-2): company = that employer, url = that
  # link, the t.me permalink rides in the description as "Source:". Posts
  # with a contact handle and no employer, digests, forms, shorteners and
  # hidden employers are dropped, so pick channels whose posts carry a
  # "Компания:" / "Company:" line or "Title @ Employer" plus an ATS or board
  # link. Measured 2026-09-03: HR-curated channels pass 32-77% of posts,
  # community channels of free-text posts pass almost none.

  - name: "Telegram @jobforjunior"
    provider: telegram-channel
    channel: jobforjunior     # handle without the @
    since_days: 14
    enabled: false
    notes: "Junior/entry RU tech roles, posts carry 'Компания:' + a geekjob.ru/ATS link; 21 jobs emitted at this 14-day window (35% of 60 posts read), measured live 2026-09-05. title_filter runs on each post's FIRST LINE; content_filter only narrows that set."

