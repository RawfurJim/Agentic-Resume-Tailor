# -- Title filter overrides (optional; scan.mjs AND scan-ats-full.mjs) --
# Both scanners apply ONE global title_filter to every company. Some
# employers legitimately deserve a WIDER title net than everyone else, without
# loosening the global filter for the rest. title_filter_overrides lets
# specific companies (matched by an explicit name/slug list) OR extra positive
# keywords into their own title match.
#
# `companies` is matched case-insensitively against:
#   - scan.mjs:          the `name:` of the tracked_companies entry, AND the
#                        company name the provider put on each job (so a Google
#                        board entry can list "deepmind" and it fires only on
#                        the DeepMind rows of that board);
#   - scan-ats-full.mjs: the company/tenant slug derived from the dataset entry
#                        (for https://uwaterloo.wd3.myworkdayjobs.com/... it is
#                        "uwaterloo").
# `positive_extra` keywords are ADDITIVE to (never a replacement for)
# title_filter.positive above, and the global `negative` list still applies —
# a negative always vetoes, override or not.
#
# v1 keeps matching simple and explicit: a literal slug list, no
# company-type inference and no domain heuristics. A company not listed in
# any entry here is completely unaffected — this is opt-in per company.
#
# Example: broaden the net for a few university/college employers so
# general campus-admin roles surface alongside EdTech/ID-focused titles.
# Add your own institutions/companies the same way.
#
# title_filter_overrides:
#   - companies: ["uwaterloo", "ubc", "fanshawec"]
#     positive_extra:
#       - "Administrator"
#       - "Coordinator"
#       - "Assistant"
#       - "Program Administrator"
#       - "Registrar"
#       - "Student Services"

# REMOVED (Jim, round 3, 2026-09-22): the live override block that let plain
# "Software Engineer" / "Developer" / "Technical Staff" titles through at the
# AI-native labs (Anthropic, OpenAI, DeepMind, Wayve, DeepL, ...) is gone. Jim
# does not want software jobs whose title says nothing about AI — a title must
# itself mention AI / ML / LLM / GenAI / Data Science / FDE etc. to be kept.
# The mechanism above still works if a block is ever added back; the export
# scripts also re-apply the current filter, so re-adding it re-surfaces rows.

